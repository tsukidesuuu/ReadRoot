                        <li><strong>خط ۲ (<code>import uvicorn</code>):</strong> ماژول وب‌سرور را به برنامه اضافه می‌کنیم تا بتوانیم سرور را مستقیماً از داخل کدهای پایتون روشن و اجرا نماییم.</li>

                        <li><strong>خط ۶ (<code>@app.get("/")</code>):</strong> این خط یک <strong>دکوراتور (Decorator)</strong> است که یک <strong>Endpoint</strong> (نقطه پایانی یا مسیر ارتباطی) از جنس متد HTTP <strong><code>GET</code></strong> در آدرس ریشه سایت (<code>"/"</code>) تعریف می‌کند.</li>
                        <li><strong>خط ۷ و ۸ (<code>def read_root(): ...</code>):</strong> بلافاصله در زیر هر Endpoint، <strong>الزاماً باید یک تابع پایتون تعریف کنیم!</strong> هر زمان که کاربری آدرس <code>"/"</code> را در مرورگر باز کند، این تابع اجرا شده و دیکشنری <code>{"Hello": "World"}</code> را برمی‌گرداند (که FastAPI به طور خودکار آن را به فرمت استاندارد JSON تبدیل کرده و به مرورگر کاربر می‌فرستد).</li>
                        <li><strong>خط ۱۰ (<code>if __name__ == "__main__":</code>):</strong> برای استفاده از وب‌سرور <code>uvicorn</code> دو راه وجود دارد: ۱) اجرا از طریق دستور در ترمینال ۲) اجرای مستقیم در داخل کد پروژه. با نوشتن این شرط، روش دوم را انتخاب کرده‌ایم؛ این شرط تضمین می‌کند که وب‌سرور فقط زمانی روشن شود که فایل <code>main.py</code> را مستقیماً اجرا (Run) کنیم (و اگر این فایل در جای دیگری ایمپورت شد، سرور به صورت ناخواسته روشن نشود).</li>
                        <li><strong>خط ۱۱ (<code>uvicorn.run(...)</code>):</strong> دستور روشن کردن وب‌سرور است که ۴ آرگومان بسیار مهم دریافت می‌کند:
                            <ol>
                                <li><strong><code>"main:app"</code>:</strong> به وب‌سرور می‌گوید به سراغ فایلی به نام <code>main</code> (همان <code>main.py</code>) برو و شیءِ <code>app</code> را که درون آن ساخته‌ایم پیدا و اجرا کن.</li>
                                <li><strong><code>host="127.0.0.1"</code>:</strong> آدرس مبنای شبکه را مشخص می‌کند. آدرس IP رزرو شده‌ی <code>127.0.0.1</code> (یا همان <code>localhost</code>) به معنای <strong>سیستم محلی (Local)</strong> خودِ شماست؛ یعنی سرور فعلاً فقط روی کامپیوتر شخصی شما بالا می‌آید.</li>
                                <li><strong><code>port=8000</code>:</strong> همان‌طور که گفتیم وب‌سرور باید به یک درگاه (Port) خاص گوش دهد؛ در اینجا پورت پیش‌فرض <code>8000</code> را به آن اختصاص داده‌ایم. اکنون برنامه در آدرس کامل <code>127.0.0.1:8000/</code> در دسترس است.</li>
                                <li><strong><code>reload=True</code>:</strong> در حین کدنویسی، هر بار که تغییری در کدها ایجاد می‌کنیم، وب‌سرور باید از نو راه‌اندازی (<code>reload</code>) شود تا تغییرات جدید اعمال گردند. با قرار دادن <code>reload=True</code>، به محض اینکه فایل را در ادیتور ذخیره (Save / Ctrl+S) کنیم، سرور به صورت خودکار کدهای جدید را بارگذاری می‌کند و نیازی به قطع و وصل دستی سرور نیست.</li>
                            </ol>
                        </li>
                    </ul>

                    <h2>۴. کالبدشکافی عمیق دکوراتورها (Decorators) و متدهای Endpoint</h2>
                    <p>در خط <code>@app.get("/")</code> با دو مفهوم بسیار مهم مهندسی نرم‌افزار و وب روبرو شدیم که درک عمیق آن‌ها حیاتی است:</p>

                    <h3>الف) اجزای تشکیل‌دهنده <code>@app.get("/")</code></h3>
                    <ul>
                        <li><strong><code>@app.</code>:</strong> علامت <code>@</code> سینتکس مربوط به دکوراتور در پایتون است و نوشتن <code>app.</code> یعنی می‌خواهیم از قابلیت‌ها و متدهای درون شیءِ <code>app</code> استفاده کنیم.</li>
                        <li><strong><code>get</code> (نوع عملیات HTTP):</strong> مشخص می‌کند که این Endpoint به درخواست‌های از جنس <code>GET</code> (دریافت اطلاعات، مثل زمانی که در مرورگر آدرسی را سرچ می‌کنیم) پاسخ می‌دهد. در پروتکل HTTP متدهای مختلفی برای Endpointها وجود دارد که مهم‌ترین آن‌ها عبارتند از:
                            <ul>
                                <li><strong><code>get</code>:</strong> برای خواندن و دریافت اطلاعات از سرور.</li>
                                <li><strong><code>post</code>:</strong> برای ارسال اطلاعات جدید به سرور (مثلاً ثبت‌نام کاربر جدید یا افزودن کالا).</li>
                                <li><strong><code>put</code>:</strong> برای ویرایش و بروزرسانی اطلاعاتِ از قبل موجود در سرور.</li>
                            </ul>
                        </li>
                    </ul>

                    <h3>ب) دکوراتور (<code>Decorator</code>) دقیقاً یعنی چه؟</h3>
                    <p>از دیدگاه مهندسی نرم‌افزار، در دنیای برنامه‌نویسی شی‌گرا <strong>۲۱ الگوی طراحی (Design Patterns)</strong> استاندارد (معروف به الگوهای GoF) وجود دارد که هر کدام برای حل یکی از مشکلات رایج در طراحی نرم‌افزار به کار می‌روند؛ یکی از معروف‌ترین آن‌ها الگوی <strong>Decorator</strong> است.</p>
                    <ul>
                        <li><strong>عملکرد دکوراتور در پایتون:</strong> دکوراتور ابزاری است که یک تابع یا شیء را می‌گیرد و <strong>بدون اینکه سورس‌کدِ داخل آن تابع را دستکاری کند، یک سری قابلیت، رفتار و کار جدید به آن اضافه می‌کند</strong>. در واقع با گذاشتن دکوراتور در بالای یک تابع، در زمان اجرا (Runtime) یک سری ویژگی (<code>attribute</code>) جدید به آن تابع الصاق می‌شود.</li>
                        <li>در مثال ما، تابع <code>read_root()</code> در ذات خود فقط یک تابع ساده‌ی پایتون است که یک دیکشنری برمی‌گرداند. اما دکوراتور <code>@app.get("/")</code> دور این تابع می‌پیچد و به آن قابلیتِ «شنیدن درخواست‌های شبکه در مسیر <code>/</code> و تبدیل خروجی به پاسخ استاندارد HTTP» را اضافه می‌کند.</li>
                    </ul>

                    <h2>۵. مسیریابی (Routing) و پارامترهای مسیر (Path Parameters)</h2>

                    <h3>الف) تعریف مسیرهای ایستا (Static Routes)</h3>
                    <p>آدرس مبنای سرور ما <code>127.0.0.1:8000</code> است. ما می‌توانیم مسیرهای متعددی برای بخش‌های مختلف سایت تعریف کنیم. برای مثال، اگر بخواهیم با سرچ کردن آدرس <code>127.0.0.1:8000/products</code> لیست قیمت موبایل نمایش داده شود، کافیست Endpoint زیر را اضافه کنیم:</p>
                    <pre><code>@app.get("/products")
def get_products(): 
# در یادداشت‌ها نام تابع read_root تکرار شده که بهتر است نام‌های یکتا بگذاریم
    return {"mobile": 3000}</code></pre>

                    <h3>ب) تعریف مسیرهای پویا و ارسال پارامتر در آدرس (Path Parameters)</h3>
                    <p>در یک فروشگاه واقعی، هزاران محصول با شناسه‌های (ID) مختلف وجود دارد و منطقی نیست برای هر محصول یک تابع جداگانه بنویسیم! راهکار این است که <strong>به مسیر URL یک پارامتر متغیر اضافه کنیم</strong>. قانون کار به این صورت است: <strong>هر نامی که داخل آکولاد <code>{}</code> در مسیر URL تعریف کرده‌ایم، باید دقیقاً با همان نام به عنوان ورودی به تابع زیرین ارسال شود</strong>:</p>
                    <pre><code>@app.get("/products/{product_id}")
def read_product(product_id: int):
    # در پروژه‌های واقعی در این خط باید با استفاده از product_id از دیتابیس اطلاعات را بخوانیم
    return {"product": product_id}</code></pre>

                    <h4>کالبدشکافی کد بالا و نحوه عملکرد آن:</h4>
                    <ol>
                        <li><strong><code>"/products/{product_id}"</code>:</strong> قرار دادن <code>product_id</code> درون آکولاد <code>{}</code> به FastAPI می‌گوید که این بخش از آدرس ثابت نیست، بلکه یک متغیر است.</li>
                        <li><strong><code>(product_id: int)</code>:</strong> متغیر گرفته شده از آدرس را به عنوان آرگومان ورودی به تابع می‌دهیم. نوشتن Type Hint به صورت <code>: int</code> دو کار شگفت‌انگیز انجام می‌دهد:
                            <ul>
                                <li>مقدار دریافتی از URL (که همیشه در ابتدا یک رشته متنی است، مثل <code>"12"</code>) را به صورت خودکار به عدد صحیح (<code>12</code>) تبدیل می‌کند.</li>
                                <li><strong>اعتبارسنجی خودکار (Validation):</strong> اگر کاربری در مرورگر به جای عدد، حروف وارد کند (مثلاً <code>127.0.0.1:8000/products/ali</code>)، فریم‌ورک به طور خودکار جلوی اجرای تابع را می‌گیرد و یک پیام خطای استاندارد به کاربر برمی‌گرداند!</li>
                            </ul>
                        </li>
                        <li><strong>تست در مرورگر:</strong> اکنون اگر کاربر آدرس <code>127.0.0.1:8000/products/12</code> را فراخوانی کند، خروجی زیر را دریافت خواهد کرد:
                            <pre><code>{
  "product": 12
}</code></pre>
                            <p>(نکته: در یک نرم‌افزار عملیاتی، پس از دریافت عدد <code>12</code>، باید به دیتابیس متصل شویم، اطلاعات کالای شماره ۱۲ را استخراج کرده و برگردانیم).</p>
                        </li>
                    </ol>

                    <h2>۶. مستندسازی خودکار با Swagger UI و مکانیزم پشت‌صحنه</h2>

                    <h3>الف) رابط کاربری تعاملی Swagger (<code>/docs</code>)</h3>
                    <p>یکی از جذاب‌ترین ویژگی‌های FastAPI این است که به صورت پیش‌فرض و بدون نیاز به نوشتن حتی یک خط کد اضافه، ابزاری به نام <strong>Swagger UI</strong> را در اختیار ما قرار می‌دهد.</p>
                    <ul>
                        <li>کافیست سرور را روشن کنید و در مرورگر به آدرس <strong><code>127.0.0.1:8000/docs</code></strong> بروید.</li>
                        <li>در این صفحه، یک رابط کاربری گرافیکی و حرفه‌ای مشاهده می‌کنید که لیست تمام Endpointهای ساخته شده (<code>/</code>، <code>/products</code> و <code>/products/{product_id}</code>) را به همراه نوع آن‌ها (<code>GET</code>) نمایش می‌دهد و به شما اجازه می‌دهد مستقیماً از داخل مرورگر به آن‌ها پارامتر بدهید و خروجی‌ها را تست کنید (بی‌نیاز از نصب نرم‌افزارهای جانبی مثل Postman در مراحل اولیه).</li>
                    </ul>

                    <h3>ب) در پشت‌صحنه (Under the Hood) چه می‌گذرد؟</h3>
                    <p>شاید برایتان سوال باشد که وقتی ده ها Endpoint مختلف می‌نویسیم، پایتون و FastAPI چگونه می‌فهمند کدام تابع را باید برای کدام درخواست اجرا کنند؟ مکانیزم پشت‌صحنه به این صورت است:</p>
                    <ol>
                        <li><strong>ثبت در جدول مسیریابی (Routing Table):</strong> به لطف دکوراتورهای <code>@app.get</code>، در لحظه‌ای که برنامه بالا می‌آید، FastAPI یک لیست (جدول) در حافظه می‌سازد و تمام آدرس‌های مسیرها را به همراه اشاره‌گر به توابع مربوطه در آن ذخیره می‌کند.</li>
                        <li><strong>ورود درخواست به نقطه متمرکز:</strong> تمام درخواست‌های کاربران (Requestها) ابتدا وارد یک فایل و درگاه مرکزی در هسته فریم‌ورک می‌شوند.</li>
                        <li><strong>تجزیه و تطبیق مسیر (Path Matching):</strong> فریم‌ورک بخش دوم آدرس (بعد از <code>127.0.0.1:8000</code>) را بررسی و تجزیه می‌کند؛ آن را با لیست مسیرهای ذخیره‌شده مقایسه کرده و با هر الگویی که برابر بود، بلافاصله تابع متصل به آن را فراخوانی می‌کند.</li>
                        <li><strong>سرعت بالا:</strong> به دلیل استفاده از ساختمان داده‌های بهینه (مانند درخت‌های جستجو و جداول هش در هسته Starlette)، کل این فرآیند مسیریابی و پیدا کردن تابع در حد <strong>چند میلی‌ثانیه (یا حتی میکروثانیه)</strong> طول می‌کشد.</li>
                    </ol>

                    <h2>ابزار Insomnia، پارامترهای Path و Query، درخواست‌های POST و مدل‌سازی با Pydantic</h2>

                    <h3>۱. راه‌اندازی ابزارها و محیط‌های توسعه نرم‌افزار</h3>
                    <p>برای تست کردن APIها و ارسال درخواست‌های مختلف (به‌ویژه درخواست‌های <code>POST</code> که با مرورگر ساده قابل ارسال نیستند)، کتابخانه <strong>Pydantic</strong> و نرم‌افزار <strong>Insomnia</strong> را نصب و راه‌اندازی می‌کنیم و توسعه را روی همان فایل پروژه قبلی ادامه می‌دهیم.</p>
                    <p>در پروژه‌های واقعی نرم‌افزاری، کدها و دیتابیس‌ها در سه محیط کاملاً مجزا نگهداری و اجرا می‌شوند و پروژه پیش از انتشار نهایی این مسیر را طی می‌کند:</p>

                    <h3>۲. پارامترهای مسیر (Path)، پارامترهای کوئری (Query) و متغیرهای اختیاری</h3>
                    <p>در پایتون و FastAPI می‌توان پارامترهای ورودی را <strong>اختیاری (Optional)</strong> تعریف کرد؛ به این معنا که کاربر می‌تواند آن پارامتر را در درخواست خود ارسال نکند.</p>
                    <ul>

                            <pre><code>from typing import Optional</code></pre>

                        <li>در نسخه‌های جدیدتر پایتون (۳.۱۰ به بعد)، از سینتکس مدرن <code>str | None = None</code> استفاده می‌شود.</li>

                    <h4>مثال اول: تفکیک Path Parameter و Query Parameter</h4>
                    <pre><code>@app.get("/products/{product_id}")
def read_root(product_id: int, title: str | None = None):

                    </ul>

def read_item(item_id: str, q: str | None = None, short: bool = False):

                        <li><strong><code>host</code> (محل استقرار Redis):</strong> آدرس سرور Redis را مشخص می‌کند. مقدار <code>"localhost"</code> به معنای اجرای Redis روی همین سیستم است؛ در محیط‌های واقعی می‌توان از سرویس‌های ابری مانند <strong>لیارا (Liara)</strong> سرور Redis تهیه کرد و آدرس آن را در این بخش قرار داد.</li>
                        <li><strong><code>port</code> (پورت ارتباطی):</strong> شماره درگاهی است که سرویس Redis روی آن به درخواست‌ها گوش می‌دهد؛ پورت استاندارد و پیش‌فرض Redis عدد <strong>6379</strong> است.</li>
                        <li><strong><code>db</code> (شماره دیتابیس):</strong> Redis به صورت پیش‌فرض دارای ۱۶ دیتابیس منطقی (از <code>0</code> تا <code>15</code>) است که مقدار پیش‌فرض آن <code>0</code> است.</li>
                        <li><strong><code>decode_responses=True</code>:</strong> باعث می‌شود خروجی‌ها به جای بایت، به صورت رشته متنی استاندارد پایتون برگردانده شوند.</li>
                    </ul>

                    <h3>۳. پیاده‌سازی جریان (Flow) ایجاد تسک در <code>api/task.py</code></h3>
                    <p>برای ساخت هر تسک جدید، فرض می‌کنیم هر تسک دارای دو فیلد <code>title</code> و <code>priority</code> است. ابتدا یک کلاس Pydantic به نام <code>TaskItem</code> برای اعتبارسنجی ورودی می‌سازیم و مقادیر اتصال Redis را در هر دو تابع <code>create_task</code> و <code>list_tasks</code> از <code>settings</code> می‌خوانیم:</p>
                    <pre><code># نسخه میانی src/api/task.py (اتصال با settings و مدل Pydantic)
from settings import settings
from fastapi import APIRouter
import redis
from pydantic import BaseModel

router = APIRouter(prefix="/tasks")

class TaskItem(BaseModel):
    title: str
    priority: str

@router.post("/")
def create_task(task: TaskItem):
    r = redis.Redis(
        host=settings.redis_host,
        port=settings.redis_port,
        db=settings.redis_db,
        decode_responses=True
    )
    r.set("val", "6655")
    return {}</code></pre>

                    <h4>جریان ۳ مرحله‌ای (Flow) تولید شناسه و ذخیره تسک</h4>
                    <p>برای تولید شناسه‌های یکتا و ذخیره ساختاریافته تسک‌ها، یک شمارنده به نام <code>task_counter</code> تعریف می‌کنیم که با دستور <code>INCR</code> هر بار یک واحد افزایش یابد. کل جریان ذخیره هر تسک در Redis شامل سه دستور زیر است:</p>
                    <ol>
                        <li><strong><code>INCR task_counter</code>:</strong> تولید یک شناسه (ID) عددی یکتا و افزایشی.</li>
                        <li><strong><code>SADD task_ids {id}</code>:</strong> ثبت شناسه جدید در مجموعه فهرست تسک‌ها.</li>
                        <li><strong><code>SET task:{id} {json}</code>:</strong> تبدیل دیکشنری تسک به رشته JSON با <code>json.dumps</code> و ذخیره آن در Redis.</li>
                    </ol>
                    <p>چون برای ذخیره دیکشنری در Redis و خواندن مجدد آن نیاز به تبدیل JSON به رشته و برعکس داریم، کتابخانه داخلی <code>json</code> را نیز وارد می‌کنیم.</p>

                    <h4>کد کامل <code>src/api/task.py</code></h4>
                    <pre><code>import json
import redis
from fastapi import APIRouter
from pydantic import BaseModel
from settings import settings

router = APIRouter(prefix="/tasks")

class TaskItem(BaseModel):
    title: str
    priority: str

@router.get("/")
def list_tasks():
    r = redis.Redis(
        host=settings.redis_host,
        port=settings.redis_port,
        db=settings.redis_db,
        decode_responses=True
    )
    return {"name": r.get("name")}

@router.post("/")
def create_task(task: TaskItem):
    r = redis.Redis(
        host=settings.redis_host,
        port=settings.redis_port,
        db=settings.redis_db,
        decode_responses=True
    )
    counter = r.incr("task_counter")
    r.sadd("task_ids", counter)
    data = {"title": task.title, "priority": task.priority}
    r.set(f"task:{counter}", json.dumps(data))
    return {"message": counter}</code></pre>

                    <h3>۴. نکته کلیدی معماری: جداسازی تکنولوژی از منطق (Decoupling)</h3>
                    <p>مشکل سوم کد فعلی این است که تکنولوژی Redis مستقیماً داخل توابع API و منطق برنامه نوشته شده است. در معماری حرفه‌ای، نباید تکنولوژی ذخیره‌سازی را مستقیم وارد منطق برنامه کرد؛ بلکه باید بخش‌ها را <strong>Decouple</strong> (جدا) کرد و از طریق <strong>Interface</strong>های مناسب به هم متصل نمود تا اگر روزی به جای Redis از دیتابیس دیگری استفاده شد، پروژه بدون شکستن منطق اصلی به کار خود ادامه دهد.</p>

                    <h2>بازآرایی تنظیمات (<code>configs</code>)، تزریق وابستگی (<code>Depends</code>) و معماری لایه‌ای (DTO، Handler و Resolver)</h2>

├── .env
└── src/
    ├── app.py
    ├── api/
    │   ├── task.py
    │   ├── user.py
    │   └── __init__.py
    ├── application/
    │   ├── dependencies/
    │   │   └── resolvers.py
    │   ├── task/
    │   │   ├── dtos/
    │   │   │   └── task_item.py
    │   │   └── handlers/
    │   │       ├── create_task_handler.py
    │   │       └── list_task_handler.py

                    <h4>انتقال <code>setting.py</code> به پوشه <code>configs</code> و اصلاح مسیر <code>.env</code></h4>
                    <p>یک پوشه به نام <code>configs</code> در <code>src</code> می‌سازیم و فایل <code>setting.py</code> را به داخل آن منتقل می‌کنیم.</p>

                    </ul>
                    <p>چون فایل <code>setting.py</code> یک لایه عمیق‌تر رفته و در <code>src/configs/</code> قرار گرفته است، نوشتن <code>env_file=".env"</code> دیگر مطمئن نیست؛ زیرا فایل <code>.env</code> دو پوشه بالاتر و در ریشه پروژه قرار دارد. برای حل دائمی این مشکل، مسیر فایل <code>.env</code> را به‌صورت پویا و نسبت به موقعیت خود فایل <code>setting.py</code> با ماژول داخلی <code>os.path</code> محاسبه می‌کنیم:</p>

    db_username: str
    db_password: str

    redis_port: str

                    <ul>

                        <li><strong><code>path.dirname(__file__)</code>:</strong> نام فایل را از انتهای مسیر حذف کرده و مسیر پوشه فعلی (<code>src/configs</code>) را در متغیر <code>curr_dir</code> قرار می‌دهد.</li>

                    </ul>

                    <h3>۲. تزریق وابستگی (Dependency Injection) و <code>Depends</code> در FastAPI</h3>
                    <p><strong>تزریق وابستگی (Dependency Injection یا DI)</strong> یکی از کلیدی‌ترین الگوهای طراحی در مهندسی نرم‌افزار است. ایده اصلی آن این است که یک تابع یا Endpoint نباید خودش مسئول ساختن و آماده‌سازی پیش‌نیازهایش (مانند اتصال دیتابیس، بررسی احراز هویت یا ساخت شیء Handler) باشد؛ بلکه این پیش‌نیازها باید از بیرون ساخته شده و به‌صورت آماده در ورودی به آن «تزریق» شوند.</p>
                    <p>مزایای کلیدی این الگو عبارت‌اند از:</p>
                    <ol>
                        <li><strong>کاهش وابستگی مستقیم (Decoupling):</strong> تابع Endpoint درگیر جزئیات ساخت اشیا نمی‌شود.</li>
                        <li><strong>استفاده مجدد از کد (Reusability):</strong> یک وابستگی یک بار نوشته می‌شود و در چندین Endpoint تزریق می‌گردد.</li>
                        <li><strong>تست‌پذیری بالا:</strong> در تست‌های خودکار می‌توان وابستگی واقعی را به‌سادگی با یک نسخه آزمایشی جایگزین کرد.</li>
                    </ol>
                    <p>در FastAPI، این مکانیزم با دستور <code>Depends</code> پیاده‌سازی می‌شود و ساختار کلی آن به شکل <code>x = Depends(func)</code> است.</p>

                    <h4>الف) مثال پایه <code>Depends</code> در <code>src/app.py</code></h4>
                    <pre><code># src/app.py
from fastapi import FastAPI, Depends
import uvicorn
from api import routes

app = FastAPI()
app.include_router(routes)

def test_depends() -&gt; int:
    return 12

@app.get("/")
def read_root(age: int = Depends(test_depends)):
    return {
        "username": age
    }</code></pre>
                    <ul>
                        <li><strong>نحوه اجرا:</strong> تابع <code>test_depends</code> به‌صورت خودکار توسط FastAPI فراخوانی می‌شود و خروجی آن (عدد <code>12</code>) بدون نیاز به صدا زدن مستقیم در بدنه <code>read_root</code>، در متغیر <code>age</code> قرار می‌گیرد.</li>
                        <li><strong>توضیح درباره نام‌گذاری مثال:</strong> قرار گرفتن متغیر <code>age</code> مقابل کلید <code>"username"</code> هیچ معنای منطقی خاصی ندارد؛ در کلاس صرفاً همان تابع آزمایشی قبلی <code>read_root</code> (که <code>{"username": "test"}</code> برمی‌گرداند) برداشته شده و مقدار <code>"test"</code> با <code>age</code> جایگزین شده است تا صرفاً عملکرد تزریق مقدار در خروجی تست شود.</li>
                    </ul>

                    <h4>ب) ارسال خودکار پارامترهای URL به تابع Dependency</h4>
                    <p>یکی از قابلیت‌های بسیار هوشمندانه FastAPI این است که توابع Dependency نیز می‌توانند دقیقاً مانند خود Endpointها، پارامترهای مسیر (Path)، کوئری (Query) یا بدنه درخواست (Body) را مستقیماً دریافت کنند.</p>
                    <pre><code>def test_depends(val: int) -&gt; int:
    return 1 + val

@app.get("/{val}")
def read_root(age: int = Depends(test_depends)):
    return {
        "username": age
    }</code></pre>
                    <p><strong>روند اجرا در پشت‌صحنه هنگام ارسال درخواست به آدرس <code>/5</code>:</strong></p>
                    <ol>
                        <li>کاربر آدرس <code>/5</code> را فراخوانی می‌کند؛ بنابراین پارامتر مسیر <code>val</code> برابر <code>5</code> است.</li>
                        <li>FastAPI پیش از اجرای <code>read_root</code> متوجه وابستگی آن به <code>Depends(test_depends)</code> می‌شود.</li>
                        <li>از آنجا که تابع <code>test_depends</code> ورودی <code>val: int</code> می‌خواهد، FastAPI مقدار <code>val=5</code> را به‌طور خودکار از URL به آن پاس می‌دهد.</li>
                        <li>تابع <code>test_depends(5)</code> اجرا شده و عدد <code>1 + 5 = 6</code> را برمی‌گرداند.</li>
                        <li>عدد <code>6</code> به عنوان مقدار <code>age</code> به <code>read_root</code> تزریق شده و پاسخ <code>{"username": 6}</code> به کاربر برگردانده می‌شود.</li>
                    </ol>

                    <h4>ج) تزریق هم‌زمان چندین Dependency</h4>
                    <p>در ورودی یک Endpoint می‌توان هر تعداد <code>Depends</code> اضافه کرد. FastAPI تمام آن‌ها را به‌صورت مستقل پیش از اجرای بدنه تابع اصلی اجرا و مقداردهی می‌کند:</p>
                    <pre><code>def test_depends(val: int) -&gt; int:
    return 1 + val

def depends2():
    return 20

@app.get("/{val}")
def read_root(
    age: int = Depends(test_depends),
    age2: int = Depends(depends2)
):
    return {
        "username": age + age2
    }</code></pre>
                    <ul>
                        <li>در این حالت، تابع <code>depends2()</code> هیچ ورودی ندارد و همیشه <code>20</code> برمی‌گرداند، در حالی که <code>test_depends(val: int)</code> به پارامتر مسیر وابسته است. اگر کاربر <code>/5</code> را ارسال کند، <code>age</code> برابر <code>6</code> و <code>age2</code> برابر <code>20</code> شده و خروجی <code>{"username": 26}</code> خواهد بود.</li>
                    </ul>

                    <h4>د) حالت دوم: ارسال مستقیم مقدار <code>val</code></h4>
                    <p>اگر بدنه <code>test_depends</code> را به <code>return val</code> تغییر دهیم، مقدار پارامتر مسیر مستقیماً و بدون تغییر در محاسبه نهایی شرکت می‌کند:</p>
                    <pre><code>def test_depends(val: int) -&gt; int:
    return val

def depends2():
    return 20

@app.get("/{val}")
def read_root(
    age: int = Depends(test_depends),
    age2: int = Depends(depends2)
):
    return {
        "username": age + age2
    }</code></pre>
                    <ul>
                        <li>در این حالت، با ارسال <code>/10</code>، مقدار <code>age</code> برابر <code>10</code> و <code>age2</code> برابر <code>20</code> می‌شود و خروجی نهایی <code>{"username": 30}</code> برگردانده می‌شود.</li>
                        <li><strong>کاربرد عملی در پروژه‌های واقعی:</strong> در نرم‌افزارهای واقعی به جای توابع آزمایشی، از <code>Depends</code> برای دریافت کاربر احرازهویت‌شده از توکن (<code>get_current_user</code>)، بررسی سطح دسترسی، مدیریت اتصال دیتابیس/Redis و تزریق Handlerها استفاده می‌شود.</li>
                    </ul>

                    <h3>۳. معماری لایه‌ای، مفهوم DTO و پیاده‌سازی <code>CreateTaskHandler</code></h3>
                    <p>در نسخه قبلی پروژه، فایل <code>src/api/task.py</code> مستقیماً به کتابخانه <code>redis</code> متصل بود و دستورات ذخیره‌سازی را درون تابع Endpoint اجرا می‌کرد. این ساختار، اصل جداسازی دغدغه‌ها را نقض می‌کند؛ زیرا در معماری استاندارد لایه‌ای، جریان ارتباطی باید به شکل زیر باشد:</p>
                    <pre><code>api  ---&gt;  application  ---&gt;  infrastructure</code></pre>
                    <ul>
                        <li><strong>لایه <code>api</code>:</strong> تنها وظیفه‌اش دریافت درخواست HTTP، سپردن کار به لایه <code>application</code> و برگرداندن پاسخ است. لایه <code>api</code> فقط باید لایه <code>application</code> را ببیند و به هیچ وجه نباید مستقیماً به لایه <code>infrastructure</code> (که دیتابیس و Redis در آن قرار دارند) دسترسی داشته باشد.</li>
                        <li><strong>لایه <code>application</code>:</strong> محل پیاده‌سازی منطق پروژه (Business Logic)، کلاس‌های <code>DTO</code>، <code>Handler</code>ها و <code>Resolver</code>ها است.</li>
                        <li><strong>لایه <code>infrastructure</code>:</strong> مسئول ارتباط مستقیم با دیتابیس‌ها (مانند Redis) و ابزارهای بیرونی است.</li>
                    </ul>

                    <h4>الف) مفهوم DTO و ساخت <code>task_item.py</code></h4>
                    <p>برای جابه‌جایی و استفاده از داده‌ها میان لایه‌های مختلف برنامه (مثلاً انتقال داده از لایه <code>api</code> به لایه <code>application</code>) از مفهوم <strong>DTO</strong> استفاده می‌کنیم.</p>
                    <ul>
                        <li><strong>DTO چیست؟</strong> مخفف <strong>Data Transfer Object</strong> (شیء انتقال داده) است؛ کلاسی که صرفاً برای جابه‌جایی ساختاریافته، معتبر و امن داده‌ها بین لایه‌های مختلف پروژه ساخته می‌شود و هیچ منطق اجرایی (Business Logic) یا کد دیتابیسی در آن قرار نمی‌گیرد.</li>
                    </ul>
                    <p>به همین دلیل، پوشه <code>dtos</code> را درون <code>src/application/task/</code> ساخته و کلاس <code>TaskItem</code> را از <code>api/task.py</code> به فایل <code>src/application/task/dtos/task_item.py</code> منتقل می‌کنیم:</p>
                    <pre><code># src/application/task/dtos/task_item.py
from pydantic import BaseModel

class TaskItem(BaseModel):
    title: str
    priority: str</code></pre>

                    <h4>ب) طراحی و پیاده‌سازی <code>CreateTaskHandler</code></h4>
                    <p>برای هر عملیات مجزا در API باید یک <strong>Handler</strong> اختصاصی داشته باشیم که آن درخواست را مدیریت کند (مثلاً یک Handler برای ایجاد تسک و یک Handler جداگانه برای لیست کردن تسک‌ها). کلاس <code>CreateTaskHandler</code> برای ساختن یک تسک، به دو چیز نیاز دارد: داده‌های تسک (<code>TaskItem</code>) و یک اتصال (Connection) به Redis.</p>
                    <pre><code># اسکلت اولیه CreateTaskHandler
from application.task.dtos.task_item import TaskItem

class CreateTaskHandler:
    def __init__(self, item: TaskItem):
        pass

    def handle(self):
        pass</code></pre>
                    <p>سپس کدهای اتصال به Redis و جریان سه‌مرحله‌ای ایجاد تسک (<code>INCR</code>، <code>SADD</code> و <code>SET</code>) را به‌طور کامل از <code>src/api/task.py</code> به داخل <code>CreateTaskHandler</code> منتقل می‌کنیم:</p>
                    <pre><code># src/application/task/handlers/create_task_handler.py
import redis
import json
from configs.setting import settings
from application.task.dtos.task_item import TaskItem

class CreateTaskHandler:
    def __init__(self, item: TaskItem):
        self.r = redis.Redis(
            host=settings.redis_host,
            port=settings.redis_port,
            db=settings.redis_db,
            decode_responses=True
        )
        self.task = item

    def handle(self):
        counter = self.r.incr("task_counter")
        self.r.sadd("task_ids", counter)

        data = {
            "title": self.task.title,
            "priority": self.task.priority,
        }

        self.r.set(f"task:{counter}", json.dumps(data))</code></pre>

                    <h4>ج) نسخه میانی <code>src/api/task.py</code> و اشکال معماری آن</h4>
                    <pre><code># نسخه موقت src/api/task.py (پیش از استفاده از Depends)
from fastapi import APIRouter
from application.task.dtos.task_item import TaskItem
from application.task.handlers.create_task_handler import CreateTaskHandler

router = APIRouter(prefix="/tasks")

@router.post("/")
def create_task(task: TaskItem):
    handler = CreateTaskHandler(task)   # &lt;--- وابستگی مستقیم و نامطلوب
    handler.handle()
    return {"message": "success"}</code></pre>
                    <ul>
                        <li><strong>ایراد این روش چیست؟</strong> تابع API در <code>task.py</code> نباید خودش شیء <code>handler</code> را بسازد. اگر در آینده سازنده کلاس <code>CreateTaskHandler</code> تغییر کند (مثلاً نیاز به یک سرویس دیتابیس یا پارامتر جدید داشته باشد)، مجبور می‌شویم کدهای لایه <code>api</code> را نیز دستکاری کنیم. برای رفع این مشکل، باید ساخت Handlerها را به مکانیزم تزریق وابستگی (<code>Depends</code>) و فایل <strong>Resolvers</strong> بسپاریم.</li>
                    </ul>

                    <h3>۴. الگوی Resolver و تزریق Handler به لایه API</h3>
                    <p>برای آنکه تمام وابستگی‌ها و سازنده‌های Handlerها در یک مکان متمرکز مدیریت شوند، پوشه‌ای به نام <code>dependencies</code> در لایه <code>application</code> و فایلی به نام <code>resolvers.py</code> در آن می‌سازیم:</p>
                    <pre><code># src/application/dependencies/resolvers.py (نسخه اول)
from application.task.dtos.task_item import TaskItem
from application.task.handlers.create_task_handler import CreateTaskHandler

def resolve_create_task_handler(task: TaskItem) -&gt; CreateTaskHandler:
    return CreateTaskHandler(task)</code></pre>
                    <p>اکنون فایل <code>src/api/task.py</code> را اصلاح می‌کنیم. دقت کنید که با این تغییر، حتی دیگر نیازی به ایمپورت کردن <code>TaskItem</code> در <code>task.py</code> هم نیست:</p>
                    <pre><code># src/api/task.py (اصلاح‌شده با Depends)
from fastapi import APIRouter, Depends
from application.task.handlers.create_task_handler import CreateTaskHandler
from application.dependencies.resolvers import resolve_create_task_handler

router = APIRouter(prefix="/tasks")

@router.post("/")
def create_task(handler: CreateTaskHandler = Depends(resolve_create_task_handler)):
    handler.handle()
    return {"message": "success"}</code></pre>
                    <p><strong>روند هوشمندانه پشت‌صحنه هنگام ارسال درخواست <code>POST /tasks</code>:</strong></p>
                    <ol>
                        <li>کاربر بدنه JSON شامل <code>title</code> و <code>priority</code> را به مسیر <code>POST /tasks</code> می‌فرستد.</li>
                        <li>FastAPI می‌بیند که <code>create_task</code> به تابع <code>resolve_create_task_handler</code> وابسته است.</li>
                        <li>FastAPI امضای <code>resolve_create_task_handler(task: TaskItem)</code> را بررسی کرده و متوجه می‌شود به یک مدل Pydantic از جنس <code>TaskItem</code> نیاز دارد.</li>
                        <li>بدنه JSON را به‌صورت خودکار اعتبارسنجی کرده، شیء <code>TaskItem</code> را می‌سازد و به <code>resolve_create_task_handler</code> پاس می‌دهد.</li>
                        <li>تابع Resolver شیء <code>CreateTaskHandler(task)</code> را ساخته و به عنوان <code>handler</code> به تابع <code>create_task</code> تزریق می‌کند؛ و در نهایت <code>handler.handle()</code> اجرا می‌شود.</li>
                    </ol>

                    <h3>۵. پیاده‌سازی مسیر نمایش لیست تسک‌ها (<code>ListTaskHandler</code> و <code>GET /tasks</code>)</h3>

                    <h4>گام ۱: به‌روزرسانی <code>src/application/dependencies/resolvers.py</code></h4>
                    <pre><code># src/application/dependencies/resolvers.py (نسخه نهایی)
from application.task.dtos.task_item import TaskItem
from application.task.handlers.create_task_handler import CreateTaskHandler
from application.task.handlers.list_task_handler import ListTaskHandler

def resolve_create_task_handler(task: TaskItem) -&gt; CreateTaskHandler:
    return CreateTaskHandler(task)

def resolve_list_task_handler() -&gt; ListTaskHandler:
    return ListTaskHandler()</code></pre>

                    <h4>گام ۲: ساخت و تکمیل <code>src/application/task/handlers/list_task_handler.py</code></h4>
                    <pre><code># src/application/task/handlers/list_task_handler.py
import redis
import json
from configs.setting import settings

class ListTaskHandler:
    def __init__(self):
        self.r = redis.Redis(
            host=settings.redis_host,
            port=settings.redis_port,
            db=settings.redis_db,
            decode_responses=True
        )

    def handle(self):
        ids = self.r.smembers("task_ids")
        tasks = []
        for id in ids:
            raw_data = self.r.get(f"task:{id}")
            tasks.append(json.loads(raw_data))
        self.r.close()
        return tasks</code></pre>
                    <p><strong>توضیح خط‌به‌خط متد <code>handle</code>:</strong></p>
                    <ol>
                        <li><strong><code>ids = self.r.smembers("task_ids")</code>:</strong> تمام شناسه‌های (ID) تسک‌های ثبت‌شده را از مجموعه (Set) به نام <code>task_ids</code> در Redis می‌خواند.</li>
                        <li><strong><code>tasks = []</code>:</strong> یک لیست خالی برای نگهداری دیکشنریِ تسک‌ها می‌سازد.</li>
                        <li><strong><code>for id in ids:</code>:</strong> روی تک‌تک شناسه‌های دریافتی حلقه می‌زند.</li>
                        <li><strong><code>raw_data = self.r.get(f"task:{id}")</code>:</strong> با استفاده از هر شناسه، رشته JSON ذخیره‌شده مربوط به آن تسک (مثلاً <code>task:1</code>) را از Redis می‌گیرد.</li>
                        <li><strong><code>tasks.append(json.loads(raw_data))</code>:</strong> رشته JSON خام را با <code>json.loads</code> به دیکشنری استاندارد پایتون تبدیل (Deserialize) کرده و به لیست <code>tasks</code> اضافه می‌کند.</li>
                        <li><strong><code>self.r.close()</code>:</strong> اتصال (Connection) به سرور Redis را می‌بندد تا منابع سیستم آزاد شود.</li>
                        <li><strong><code>return tasks</code>:</strong> لیست کامل تسک‌ها را به لایه <code>api</code> برمی‌گرداند.</li>
                    </ol>

                    <h4>گام ۳: کد نهایی <code>src/api/task.py</code></h4>
                    <pre><code># src/api/task.py (نسخه نهایی)
from fastapi import APIRouter, Depends
from application.task.handlers.create_task_handler import CreateTaskHandler
from application.task.handlers.list_task_handler import ListTaskHandler
from application.dependencies.resolvers import (
    resolve_create_task_handler,
    resolve_list_task_handler
)

router = APIRouter(prefix="/tasks")

@router.post("/")
def create_task(handler: CreateTaskHandler = Depends(resolve_create_task_handler)):
    handler.handle()
    return {"message": "success"}

@router.get("/")
def list_task(handler: ListTaskHandler = Depends(resolve_list_task_handler)):
    data = handler.handle()
    return {"data": data}</code></pre>

                    <h4>تست نهایی در Insomnia</h4>
                    <p>با ارسال درخواست <code>GET</code> به آدرس <code>127.0.0.1:8000/tasks</code> در Insomnia (پس از ثبت چند تسک با <code>POST</code>)، لیست تمام تسک‌ها در قالب <code>{"data": [...]}</code> نمایش داده می‌شود.</p>

                    <h3>۶. نکات تکمیلی و چشم‌انداز مرحله بعدی معماری</h3>
                    <ul>
                        <li><strong>اهمیت بستن اتصال (<code>self.r.close()</code>):</strong> در <code>ListTaskHandler</code> پس از پایان کار، اتصال Redis را بستیم تا منابع آزاد شوند. در پروژه‌های واقعی، بستن اتصال باید در <code>CreateTaskHandler</code> نیز انجام شود (یا از Connection Pool و <code>yield</code> در <code>Depends</code> استفاده گردد) تا سرور با خطای اشغال شدن سقف اتصالات Redis روبه‌رو نشود.</li>
                        <li><strong>محافظت در برابر کلیدهای حذف‌شده در <code>json.loads</code>:</strong> اگر به هر دلیلی کلید <code>task:{id}</code> از Redis پاک شده باشد اما شناسه‌اش همچنان در مجموعه <code>task_ids</code> باشد، خروجی <code>self.r.get(...)</code> برابر <code>None</code> خواهد شد و <code>json.loads(None)</code> خطا تولید می‌کند؛ بنابراین در محیط Production معمولاً قبل از تبدیل JSON شرط <code>if raw_data:</code> بررسی می‌شود.</li>

                    <h1>اصول مهندسی نرم‌افزار، کلاس‌های انتزاعی (ABC)، الگوی استراتژی و وارونگی وابستگی (DIP)</h1>
                    <p>در این مبحث، از صرفِ کدنویسی به سمت <strong>مهندسی نرم‌افزار و معماری تمیز (Clean Architecture)</strong> حرکت می‌کنیم تا یاد بگیریم چگونه کدهایی بنویسیم که در برابر تغییرات آینده مقاوم باشند و در پروژه واقعی FastAPI از آن‌ها استفاده کنیم.</p>

                    <h2>۱. صورت مسئله کلی و چالش تغییرپذیری در نرم‌افزار</h2>
                    <p>در بسیاری از سیستم‌های واقعی، با یک الگوی تکراری روبه‌رو هستیم: <strong>«یک کار مشخص باید با روش‌های مختلفی انجام شود»</strong>. برای درک بهتر، به این سناریوها توجه کنید:</p>
                    <ul>
                        <li><strong>سیستم پرداخت (Payment):</strong> در یک فروشگاه، عملیات پرداخت می‌تواند از طریق درگاه بانکی (Gateway)، کیف پول و اعتبار (Wallet)، یا به صورت نقدی/کارت‌خوان در محل (Cash) انجام شود.</li>
                        <li><strong>نرم‌افزار مسیریابی (Routing):</strong> محاسبه مسیر از مبدأ به مقصد بسته به وسیله نقلیه (ماشین، دوچرخه یا موتور) الگوریتم متفاوتی دارد.</li>

                    </ul>

                    <h3>کاربرد مستقیم این مبحث در پروژه FastAPI ما</h3>

                    <h2>۲. سیر تکامل کد: از روش ابتدایی تا شی‌گرایی پایه</h2>
                    <p>بیایید سناریوی <strong>سیستم پرداخت</strong> را قدم‌به‌قدم پیاده‌سازی و ایرادهای معماری هر مرحله را کالبدشکافی کنیم.</p>

                    <h3>مرحله اول: روش ابتدایی (استفاده از <code>if / elif</code>)</h3>
                    <pre><code>def checkout(amount: int, method: str):

        # منطق پیچیده اتصال به درگاه بانکی، ثبت تراکنش در دیتابیس و...

    elif method == "wallet":
        # منطق بررسی موجودی کیف پول، کسر اعتبار و...
        print(f"Wallet payment {amount}")
    elif method == "cash":
        # منطق ثبت سفارش پرداخت در محل و...
        print(f"Cash payment {amount}")</code></pre>
                    <p>این روش <strong>دو مشکل اساسی و بزرگ</strong> دارد که به شدت با اصول مهندسی نرم‌افزار در تناقض است:</p>
                    <ol>
                        <li><strong>ناپایداری نسبت به تعداد روش‌ها (مشکل اول):</strong> تابع <code>checkout</code> به شدت ناپایدار (Unstable) است. با اضافه شدن هر روش پرداخت جدید باید یک بلوک <code>elif</code> جدید به آن اضافه کنیم و با حذف هر روش باید کد این تابع را پاک‌سازی کنیم.</li>

                    <h3>مرحله دوم: تبدیل هر استراتژی به یک کلاس (شی‌گرایی پایه)</h3>
                    <pre><code>class Payment:
    def pay(self, amount):

class GatewayPayment(Payment):

class WalletPayment(Payment):
    def pay(self, amount):
        print(f"Wallet payment {amount}")

class CashPayment(Payment):
    def pay(self, amount):
        print(f"Cash payment {amount}")

def checkout(amount: int, method: str):
    if method == "gateway":
        p = GatewayPayment()
        p.pay(amount)
    elif method == "wallet":
        p = WalletPayment()
        p.pay(amount)
    elif method == "cash":
        p = CashPayment()
        p.pay(amount)</code></pre>
                    <blockquote><strong>قانون طلایی مهندسی نرم‌افزار:</strong> هر استراتژی، الگوریتم یا روش اجرایی که در پروژه دارید را همیشه به یک <strong>کلاس مستقل</strong> تبدیل کنید و هرگز منطق آن‌ها را به صورت رهاشده داخل شرط‌ها و «کف پروژه» ننویسید.</blockquote>
                    <p><strong>ارزیابی این مرحله:</strong></p>
                    <ul>
                        <li><strong>مشکل دوم حل شد:</strong> منطق هر روش پرداخت در کلاس خودش کپسوله شده است. اگر فردا منطق پرداخت درگاه بانکی عوض شود، فقط داخل کلاس <code>GatewayPayment</code> تغییر می‌دهیم.</li>

                    </ul>

                    <h2>۳. کلاس‌های انتزاعی (Abstract Classes) و ماژول <code>abc</code></h2>
                    <p>در کد مرحله دوم، هیچ مانعی وجود ندارد که یک برنامه‌نویس به اشتباه بنویسد <code>p = Payment(); p.pay(1000)</code>. کلاس <code>Payment</code> خودش یک روش پرداخت واقعی نیست؛ بلکه صرفاً یک <strong>کلاس والد (الگو)</strong> است. بنابراین، <strong>کاربران سیستم فقط باید از کلاس‌های فرزند استفاده کنند و نباید هیچ‌کس بتواند مستقیماً از <code>Payment</code> شیء بسازد</strong>.</p>

                    <h3>راه‌حل: تعریف کلاس انتزاعی (Abstract Class)</h3>
                    <p>این مفهوم دقیقاً معادل <strong>کلاس پایه انتزاعی</strong> و <strong>توابع مجازی خالص (Pure Virtual Functions)</strong> در زبان C++ است. در پایتون، برای پیاده‌سازی این مفهوم از ماژول استاندارد <strong><code>abc</code></strong> (مخفف <strong>Abstract Base Class</strong>) استفاده می‌کنیم:</p>
                    <pre><code>from abc import ABC, abstractmethod

class Payment(ABC):
    @abstractmethod
    def pay(self, amount):
        ...</code></pre>

                        <li><strong>ارث‌بری خاصیت انتزاعی در صورت عدم پیاده‌سازی:</strong> اگر یک کلاس فرزند متد <code>pay</code> را پیاده‌سازی نکند، <strong>خودش نیز به یک کلاس انتزاعی تبدیل می‌شود</strong> و قابل نمونه‌سازی نخواهد بود.</li>
                    </ol>

                    <ul>

                    <blockquote><strong>چرا این جداسازی حیاتی است؟</strong> اگر اجزای برنامه به هم گره بخورند، پروژه شبیه یک آشپزخانه بسیار شلوغ می‌شود که تمام ظرف‌ها روی هم چیده شده‌اند؛ با تکان دادن یک بخش، کل سیستم فرو می‌ریزد و «فرمان پروژه از دستتان در می‌رود».</blockquote>

                    <h2>۵. تزریق وابستگی در سطح کلاس‌ها (سناریوی ثبت‌نام و نوتیفیکیشن)</h2>
                    <h4>روش اشتباه (وابستگی به پیاده‌سازی خاص)</h4>
                    <pre><code>class EmailService:
    def send(self):
        print("Email sent")

class RegisterUser:
    def __init__(self):
        # مشکل معماری: وابستگی مستقیم به یک پیاده‌سازی خاص!
        self.email = EmailService()

    def process(self):
        # ... منطق ثبت‌نام کاربر ...
        self.email.send()</code></pre>
                    <blockquote><strong>قاعده طلایی ارتباط بین کلاس‌ها:</strong> کلاس‌ها هرگز نباید به یک نمونه خاص از کلاس دیگر وابسته باشند؛ <strong>کلاس‌ها باید از طریق انتزاع (Abstraction) با یکدیگر صحبت کنند</strong>.</blockquote>

                    <h4>روش صحیح (وابستگی به انتزاع و تزریق از بیرون)</h4>
                    <pre><code>from abc import ABC, abstractmethod

class Notification(ABC):
    @abstractmethod
    def send(self):
        ...

class EmailService(Notification):
    def send(self):
        print("Email sent")

class SmsService(Notification):
    def send(self):
        print("SMS sent")

class RegisterUser:
    def __init__(self, notif: Notification):
        # وابستگی صرفاً به انتزاع، نه به ایمیل یا پیامک
        self.notif = notif

    def process(self):
        # ... منطق ثبت‌نام کاربر ...
        self.notif.send()

# انتخاب پیاده‌سازی واقعی در بیرون از کلاس:
register = RegisterUser(EmailService())
register.process()

# تغییر به پیامک بدون دست زدن به کلاس RegisterUser:
register = RegisterUser(SmsService())
register.process()</code></pre>

                    <h2>۶. ریشه ترکیب (Composition Root) و اتصال به پروژه FastAPI</h2>
                    <p>به آن خط یا ماژول واحدی در برنامه که اشیاء واقعی را می‌سازد و به یکدیگر تزریق می‌کند (مانند خط <code>RegisterUser(EmailService())</code>)، در مهندسی نرم‌افزار <strong>Composition Root (ریشه ترکیب)</strong> می‌گویند.</p>
                    <ul>
                        <li>این نقطه، <strong>تنها جایی در کل پروژه</strong> است که اشکالی ندارد از تغییرات و کلاس‌های واقعی (Concrete) باخبر باشد.</li>
                        <li>اگر امروز از ایمیل به پیامک یا از Redis به PostgreSQL مهاجرت کنیم، <strong>فقط یک خط در Composition Root تغییر می‌کند</strong> و هیچ فایل دیگری در سراسر برنامه تغییر نمی‌کند.</li>
                        <li>در ساختار پروژه FastAPI ما، پوشه <strong><code>dependencies</code></strong> (فایل <code>resolvers.py</code>) دقیقاً نقش <strong>Composition Root</strong> را ایفا می‌کند.</li>
                    </ul>

                    <h2>۷. نکات تکمیلی و تخصصی (فراتر از کلاس)</h2>
                    <h3>۱. ارتباط این معماری با اصل Open/Closed (از اصول پنج‌گانه SOLID)</h3>
                    <blockquote>«نرم‌افزارها (کلاس‌ها، ماژول‌ها و توابع) باید <strong>برای گسترش باز (Open for Extension)</strong> اما <strong>برای تغییر بسته (Closed for Modification)</strong> باشند.»</blockquote>
                    <h3>۲. تفاوت اتصال محکم (Tight Coupling) و اتصال سست (Loose Coupling)</h3>
                    <ul>
                        <li><strong>اتصال محکم (Tight Coupling):</strong> زمانی است که کلاسی خودش داخل سازنده <code>self.email = EmailService()</code> را می‌سازد و تست‌نویسی را دشوار می‌کند.</li>
                        <li><strong>اتصال سست (Loose Coupling):</strong> زمانی است که وابستگی از بیرون و بر پایه یک <code>ABC</code> تزریق می‌شود و در تست می‌توان به سادگی از <code>MockNotification</code> استفاده کرد.</li>
                    </ul>
                    <h3>۳. نکته فنی درباره <code>@abstractmethod</code> و <code>ABC</code> در پایتون</h3>

                        <li><strong><code>get_by_id(self, task_id: int)</code>:</strong> شناسه یک تسک خاص را می‌گیرد تا جزئیات کامل آن را برگرداند.</li>

                    <h2>۴. پیاده‌سازی واقعی مخزن Redis (<code>RedisTaskRepository</code>) و مبحث تراکنش‌ها</h2>
                    <p>در عملیات ذخیره یک تسک در Redis، برای آنکه دستورات ثبت شناسه در <code>task_ids</code> و ذخیره JSON در <code>task:{id}</code> به صورت <strong>اتمیک (Atomic)</strong> اجرا شوند (یا همه با هم یا هیچ‌کدام)، از <strong><code>pipeline(transaction=True)</code></strong> و <strong><code>execute()</code></strong> استفاده می‌کنیم:</p>
                    <pre><code># src/infrastructure/redis/task_repository.py
import json
import redis
from application.task.ports.task_repository import TaskRepository
from application.task.dtos.task_item import TaskItem

class RedisTaskRepository(TaskRepository):
    def __init__(self, client: redis.Redis):
        self.client = client

    def save(self, task_item: TaskItem):
        counter = self.client.incr("task_counter")

        data = {
            "title": task_item.title,
            "priority": task_item.priority,
        }

        pipe = self.client.pipeline(transaction=True)
        pipe.sadd("task_ids", counter)
        pipe.set(f"task:{counter}", json.dumps(data))
        pipe.execute()
        self.client.close()

    def get_all(self):
        ids = self.client.smembers("task_ids")
        tasks = []
        for task_id in ids:
            raw_data = self.client.get(f"task:{task_id}")
            if raw_data:
                tasks.append(json.loads(raw_data))
        return tasks

    def delete(self, task_id: int):
        self.client.srem("task_ids", task_id)
        self.client.delete(f"task:{task_id}")

    def get_by_id(self, task_id: int):
        return self.client.get(f"task:{task_id}")</code></pre>

import redis
from fastapi import Depends
from application.task.handlers.create_task_handler import CreateTaskHandler
from application.task.handlers.list_task_handler import ListTaskHandler
from application.task.handlers.delete_task_handler import DeleteTaskHandler
from infrastructure.redis.client import get_redis_client
from infrastructure.redis.task_repository import RedisTaskRepository

def resolve_create_task_handler(
    client: redis.Redis = Depends(get_redis_client)
) -&gt; CreateTaskHandler:
    repo = RedisTaskRepository(client=client)
    return CreateTaskHandler(repo=repo)

def resolve_list_task_handler(
    client: redis.Redis = Depends(get_redis_client)
) -&gt; ListTaskHandler:
    repo = RedisTaskRepository(client=client)
    return ListTaskHandler(repo=repo)

def resolve_delete_task_handler(
    client: redis.Redis = Depends(get_redis_client)
) -&gt; DeleteTaskHandler:
    repo = RedisTaskRepository(client=client)
    return DeleteTaskHandler(repo=repo)</code></pre>

                    <h2>۷. تکمیل لایه API (<code>src/api/task.py</code>)، مسیر Delete و تست نهایی</h2>
                    <pre><code># src/api/task.py
from fastapi import APIRouter, Depends
from application.task.dtos.task_item import TaskItem
from application.task.handlers.create_task_handler import CreateTaskHandler
from application.task.handlers.list_task_handler import ListTaskHandler
from application.task.handlers.delete_task_handler import DeleteTaskHandler
from resolvers import (
    resolve_create_task_handler,
    resolve_list_task_handler,
    resolve_delete_task_handler,
)

router = APIRouter(prefix="/tasks")

@router.get("/")
def list_tasks(
    handler: ListTaskHandler = Depends(resolve_list_task_handler)
):
    return handler.handle()

@router.post("/")
def create_task(
    task_item: TaskItem,
    handler: CreateTaskHandler = Depends(resolve_create_task_handler)
):
    handler.handle(item=task_item)
    return {"message": "success"}

@router.delete("/{task_id}")
def delete_task(
    task_id: int,
    handler: DeleteTaskHandler = Depends(resolve_delete_task_handler)
):
    handler.handle(item_id=task_id)
    return {"message": "success"}</code></pre>

            if (pythonBox && fastapiBox) {
                const pyRect = pythonBox.getBoundingClientRect();
                const faRect = fastapiBox.getBoundingClientRect();

                const pyCenterX = pyRect.left - canvasRect.left + pyRect.width / 2;
                const pyBottomY = pyRect.bottom - canvasRect.top;
                const faCenterX = faRect.left - canvasRect.left + faRect.width / 2;
                const faTopY = faRect.top - canvasRect.top;
                const faBottomY = faRect.bottom - canvasRect.top;

                // Central vertical solid blue line from Python to FastAPI
                pathsHTML += `<line x1="${pyCenterX}" y1="${pyBottomY}" x2="${faCenterX}" y2="${faTopY}" stroke="var(--rm-line-blue)" stroke-width="4" />`;

                // Branching dotted blue curves from Python to Left & Right nodes
                const pyLeftX = pyRect.left - canvasRect.left;
                const pyRightX = pyRect.right - canvasRect.left;
                const pyMidY = pyRect.top - canvasRect.top + pyRect.height / 2;

                roadmapRows[0].left.forEach(item => {
                    const el = document.getElementById(`node-box-${item.id}`);
                    if (el) {
                        const r = el.getBoundingClientRect();
                        const targetX = r.right - canvasRect.left;
                        const targetY = r.top - canvasRect.top + r.height / 2;
                        const ctrlX1 = pyLeftX - 40;
                        const ctrlX2 = targetX + 40;
                        pathsHTML += `<path d="M ${pyLeftX} ${pyMidY} C ${ctrlX1} ${pyMidY}, ${ctrlX2} ${targetY}, ${targetX} ${targetY}" fill="none" stroke="var(--rm-line-blue)" stroke-width="3.5" stroke-dasharray="4 6" stroke-linecap="round" />`;
                    }
                });

                roadmapRows[0].right.forEach(item => {
                    const el = document.getElementById(`node-box-${item.id}`);
                    if (el) {
                        const r = el.getBoundingClientRect();
                        const targetX = r.left - canvasRect.left;
                        const targetY = r.top - canvasRect.top + r.height / 2;
                        const ctrlX1 = pyRightX + 40;
                        const ctrlX2 = targetX - 40;
                        pathsHTML += `<path d="M ${pyRightX} ${pyMidY} C ${ctrlX1} ${pyMidY}, ${ctrlX2} ${targetY}, ${targetX} ${targetY}" fill="none" stroke="var(--rm-line-blue)" stroke-width="3.5" stroke-dasharray="4 6" stroke-linecap="round" />`;
                    }
                });

                // Central vertical spine below FastAPI + horizontal dotted branches to Part 1..8
                const lastFastapiEl = document.getElementById(`node-box-${fastapiNodes[fastapiNodes.length - 1].id}`);
                if (lastFastapiEl) {
                    const lastRect = lastFastapiEl.getBoundingClientRect();
                    const spineEndY = lastRect.top - canvasRect.top + lastRect.height / 2;

                    pathsHTML += `<line x1="${faCenterX}" y1="${faBottomY}" x2="${faCenterX}" y2="${spineEndY}" stroke="var(--rm-line-blue)" stroke-width="4" stroke-linecap="round" />`;

                    fastapiNodes.forEach(node => {
                        const el = document.getElementById(`node-box-${node.id}`);
                        if (el) {
                            const r = el.getBoundingClientRect();
                            const midY = r.top - canvasRect.top + r.height / 2;
                            const targetX = node.side === "left"
                                ? (r.right - canvasRect.left)
                                : (r.left - canvasRect.left);

                            pathsHTML += `<line x1="${faCenterX}" y1="${midY}" x2="${targetX}" y2="${midY}" stroke="var(--rm-line-blue)" stroke-width="3.5" stroke-dasharray="4 6" stroke-linecap="round" />`;
                        }
                    });
                }
            }

            svg.innerHTML = pathsHTML;
        }

        window.addEventListener("resize", drawConnectorLines);
        window.addEventListener("load", () => setTimeout(drawConnectorLines, 150));

        // =========================================================================
        // 5. STATUS ACTIONS & MODAL HANDLERS
        // =========================================================================
        function setLearning(id) {
            state.learningId = id;
            saveState();
            renderRoadmap();
        }

        function toggleDone(id) {
            const idx = state.doneIds.indexOf(id);
            if (idx > -1) {
                state.doneIds.splice(idx, 1);
            } else {
                state.doneIds.push(id);
                state.skipIds = state.skipIds.filter(x => x !== id);
            }
            saveState();
            renderRoadmap();
        }

        function toggleSkip(id) {
            const idx = state.skipIds.indexOf(id);
            if (idx > -1) {
                state.skipIds.splice(idx, 1);
            } else {
                state.skipIds.push(id);
                state.doneIds = state.doneIds.filter(x => x !== id);
            }
            saveState();
            renderRoadmap();
        }

        function handleNodeClick(id) {
            const topic = topicsDB[id];
            if (!topic) return;

            activeTopicId = id;
            state.learningId = id;
            saveState();
            renderRoadmap();

            // Direct lesson open (for FastAPI leaves without terminal)
            if (topic.directLesson) {
                openContentModal('lesson');
                return;
            }

            document.getElementById("choiceTitle").textContent = topic.title;
            
            const practiceChoiceBtn = document.getElementById("choiceBtnPractice");
            practiceChoiceBtn.disabled = !!topic.disablePractice;

            document.getElementById("choiceModal").classList.add("open");
        }

        function closeChoiceModal() {
            document.getElementById("choiceModal").classList.remove("open");
        }

        function openContentModal(mode) {
            const topic = topicsDB[activeTopicId];
            if (mode === "practice" && topic.disablePractice) return;

            closeChoiceModal();
            
            document.getElementById("lessonView").innerHTML = topic.notes;
            document.getElementById("practicePrompt").innerHTML = topic.exercise || "";
            
            const tabBtnPractice = document.getElementById("tabBtnPractice");
            tabBtnPractice.disabled = !!topic.disablePractice;
            tabBtnPractice.style.display = topic.disablePractice ? "none" : "inline-block";

            document.getElementById("contentModal").classList.add("open");

            if (!editorInstance) {
                editorInstance = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
                    mode: "python",
                    theme: "dracula",
                    lineNumbers: true,
                    indentUnit: 4
                });
            }
            editorInstance.setValue(topic.starterCode || "");
            document.getElementById("codeOutput").textContent = 'Click "Run Code" to execute your Python script...';
            document.getElementById("codeOutput").style.color = "#a6e3a1";

            switchContentTab(mode);
        }

        function switchContentTab(mode) {
            const topic = topicsDB[activeTopicId];
            if (mode === "practice" && topic && topic.disablePractice) return;

            const lessonView = document.getElementById("lessonView");
            const practiceView = document.getElementById("practiceView");
            const btnLesson = document.getElementById("tabBtnLesson");
            const btnPractice = document.getElementById("tabBtnPractice");

            if (mode === "lesson") {
                lessonView.style.display = "block";
                practiceView.style.display = "none";
                btnLesson.classList.add("active");
                btnPractice.classList.remove("active");
            } else {
                lessonView.style.display = "none";
                practiceView.style.display = "block";
                btnLesson.classList.remove("active");
                btnPractice.classList.add("active");
                setTimeout(() => editorInstance && editorInstance.refresh(), 50);
            }
        }

        function closeContentModal() {
            document.getElementById("contentModal").classList.remove("open");
        }

        // =========================================================================
        // 6. PYODIDE IN-BROWSER PYTHON RUNNER
        // =========================================================================
        async function initPyodideEngine() {
            try {
                pyodideReady = await loadPyodide();
            } catch (e) {
                console.warn("Pyodide failed to load:", e);
            }
        }
        initPyodideEngine();

        async function runPython() {
            const outputEl = document.getElementById("codeOutput");
            if (!pyodideReady) {
                outputEl.style.color = "#facc15";
                outputEl.textContent = "Loading Python WebAssembly engine... Please wait a moment and click Run Code again.";
                return;
            }
            outputEl.style.color = "#94a3b8";
            outputEl.textContent = "Running...";

            try {
                pyodideReady.runPython(`
                    import sys, io
                    sys.stdout = io.StringIO()
                `);
                await pyodideReady.runPythonAsync(editorInstance.getValue());
                const stdout = pyodideReady.runPython("sys.stdout.getvalue()");
                outputEl.style.color = "#a6e3a1";
                outputEl.textContent = stdout || "Executed successfully (no output).";
            } catch (err) {
                outputEl.style.color = "#f38ba8";
                outputEl.textContent = err.toString();
            }
        }

        // =========================================================================
        // 7. THEME MANAGEMENT
        // =========================================================================
        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            document.getElementById("themeBtn").textContent = theme === "dark" ? "Light Mode" : "Dark Mode";
        }

        function toggleTheme() {
            state.theme = state.theme === "dark" ? "light" : "dark";
            applyTheme(state.theme);
            saveState();
        }

        applyTheme(state.theme || "light");
        renderRoadmap();
    </script>
</body>
</html>
